<app-multi-picker
    [items]="customers"
    [pickedItems]="pickedCustomers"
    (pickedItemsChange)="pickedCustomersChange.emit($event)"
    (Change)="Change.emit()"
    [disabled]="disabled"
    [multi]="multi"
    [addButtonText]="'customers:picker.add' | t"
    [placeholder]="'customers:picker.placeholder' | t"
    />
