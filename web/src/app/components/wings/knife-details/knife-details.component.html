<app-confirmation-dialog
    #delete_confirmation />

<app-save-changes-button
    [show]="!loading && !knife_form.pristine"
    (save)="save(false)"
    />

<app-unsaved-changes-dialog #unsaved_changes_dialog></app-unsaved-changes-dialog>

<app-page-loading
  [loading_message]="'Loading knife...'"
  [icon_size]="'3x'"
  [hidden]="!loading"
  [stretch_height]="true" />

<div class="row justify-content-center" [hidden]="loading">
<div class="col-12 col-md-8">
    <div class="d-flex flex-row justify-content-between align-items-center">
        <h3><span class="icon-knife"></span> Edit Knife</h3>
        <div class="d-flex flex-row justify-items-end">
            <button class="btn btn-warning upper-button" (click)="gotoKnivesList()" title="Back to knives">
                <div class="btn-icon"><fa-icon [icon]="faArrowLeft"></fa-icon></div>
            </button>
            <button class="btn btn-success upper-button" type="submit" [class.disabled]="saving" (click)="save()" title="Save">
                <div class="btn-icon"><fa-icon [icon]="faSave"></fa-icon></div>
            </button>
            <button class="btn btn-danger upper-button" (click)="confirm_delete()" title="Delete">
                <div class="btn-icon"><fa-icon [icon]="faTrashAlt"></fa-icon></div>
            </button>
        </div>
    </div>

    <form novalidate #knife_form="ngForm">
        <div class="row g-3 align-items-end">
            <div class="col-12 col-md-6">
                <label class="form-label" for="knife_name">Name</label>
                <input id="knife_name" name="name" type="text" class="form-control" maxlength="255" required [(ngModel)]="name">
            </div>
            <div class="col-6 col-md-3">
                <div class="text-body-secondary small">Width (L1 → Crown)</div>
                <div>{{ knife?.width_cm | number: '1.0-2' }} cm</div>
            </div>
            <div class="col-6 col-md-3 text-end">
                <button type="button" class="btn btn-outline-primary" (click)="advancedEdit()">
                    <fa-icon [icon]="faPenRuler"></fa-icon> Advanced edit
                </button>
            </div>
        </div>

        <div class="form-check mb-2">
            <input class="form-check-input" type="checkbox" id="knife_show_babies" [ngModelOptions]="{ standalone: true }"
                [(ngModel)]="showBabies" (ngModelChange)="draw()">
            <label class="form-check-label" for="knife_show_babies">Preview with babies</label>
        </div>

        <div class="knife_canvas_container">
            <canvas #knife_canvas></canvas>
        </div>

        <div class="row buttons-area">
            <div class="col-12 col-md-4 d-flex justify-content-center">
                <button type="button" class="btn btn-warning" (click)="gotoKnivesList()">
                    <div class="btn-icon"><fa-icon [icon]="faArrowLeft"></fa-icon></div>
                    <div>Back</div>
                </button>
            </div>
            <div class="col-12 col-md-4 d-flex justify-content-center">
                <button class="btn btn-success" type="submit" [class.disabled]="saving" (click)="save()">
                    <div class="btn-icon"><fa-icon [icon]="faSave"></fa-icon></div>
                    <div>Save Knife</div>
                </button>
            </div>
            <div class="col-12 col-md-4 d-flex justify-content-center">
                <button type="button" class="btn btn-danger" (click)="confirm_delete()">
                    <div class="btn-icon"><fa-icon [icon]="faTrashAlt"></fa-icon></div>
                    <div>Delete Knife</div>
                </button>
            </div>
        </div>
    </form>
</div>
</div>
