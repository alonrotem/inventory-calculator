<app-multi-picker
    [items]="knives"
    [itemLabel]="knifeLabel"
    [itemPreview]="knifePreview"
    [pickedItems]="pickedKnives"
    (pickedItemsChange)="pickedKnivesChange.emit($event)"
    (Change)="Change.emit()"
    [disabled]="disabled"
    [multi]="multi"
    [addButtonText]="'knives:picker.add' | t"
    [placeholder]="'knives:picker.placeholder' | t"
    />
