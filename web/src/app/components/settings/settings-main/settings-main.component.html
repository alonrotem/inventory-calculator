<app-unsaved-changes-dialog #unsaved_changes_dialog></app-unsaved-changes-dialog>

<div class="row justify-content-center">
    <div class="col-12 col-md-8">
      <div class="settings-title">
        <h3><fa-icon [icon]="faGears"></fa-icon> {{ 'settings:main.title' | t }}</h3>
        <button #btn_save class="btn btn-success" *ngIf="pending_changes" (click)="save_settings()">
          <fa-icon [icon]="faSave" class="action-icon me-2"></fa-icon>
          <span>{{ 'common:dialogs.save_changes' | t }}</span>
        </button>
      </div>
  <ul class="nav nav-tabs">
    <li class="nav-item">
      <a [ngClass]="{'nav-link': true, 'active': (currentPage == settingsPage.alerts)}" aria-current="page" (click)="setPage(settingsPage.alerts)">{{ 'settings:main.tab_alerts' | t }}</a>
    </li>
    <li class="nav-item">
      <a  [ngClass]="{'nav-link': true, 'active': (currentPage == settingsPage.notifications)}" (click)="setPage(settingsPage.notifications)">{{ 'settings:main.tab_notifications' | t }}</a>
    </li>
    <li class="nav-item">
      <a  [ngClass]="{'nav-link': true, 'active': (currentPage == settingsPage.ui)}" (click)="setPage(settingsPage.ui)">{{ 'settings:main.tab_ui' | t }}</a>
    </li>
    <li class="nav-item">
      <a [ngClass]="{'nav-link': true, 'active': (currentPage == settingsPage.backup)}" (click)="setPage(settingsPage.backup)">{{ 'settings:main.tab_backup' | t }}</a>
    </li>
    <li class="nav-item">
      <a [ngClass]="{'nav-link': true, 'active': (currentPage == settingsPage.system_logs)}" (click)="setPage(settingsPage.system_logs)">{{ 'settings:main.tab_logs' | t }}</a>
    </li>    
  </ul>
  <div class="settings-contents">
    
    <app-settings-alerts 
        [ngClass]="{ 'd-none': (currentPage != settingsPage.alerts)}"
        [settings]="settings"
        (settings_changed)="check_changes()"
        />
    
    <app-settings-notifications 
      [ngClass]="{ 'd-none': (currentPage != settingsPage.notifications)}"
      />

    <app-settings-ui
      [ngClass]="{ 'd-none': (currentPage != settingsPage.ui)}"
        [settings]="settings"
        (settings_changed)="check_changes()"
      />

    <app-backup-download 
      [ngClass]="{ 'd-none': (currentPage != settingsPage.backup)}"
      />

    <app-backup-upload 
      [ngClass]="{ 'd-none': (currentPage != settingsPage.backup)}"
      />

    <app-system-logs 
      [ngClass]="{ 'd-none': (currentPage != settingsPage.system_logs)}"
      />

  </div>
    </div>
</div>
