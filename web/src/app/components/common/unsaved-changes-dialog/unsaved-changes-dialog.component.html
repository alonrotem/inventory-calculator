

<app-modal-dialog 
    #dialog 
        [hide_buttons]="true" 
        [modalTitle]="modalTitle">
    <div #modalContent style="display: flex; flex-direction: row; flex-wrap: nowrap; align-items: center;">
        <div class="dialog-content" [innerHTML]="modalText"></div>
    </div>
        <div class="modal-footer">
        <button type="button" class="btn btn-success" (click)="save()"><fa-icon [icon]="faSave" ></fa-icon> {{ 'common:dialogs.save_and_continue' | t }}</button>
        <button type="button" class="btn btn-warning" (click)="discard()"><fa-icon [icon]="faArrowLeft" ></fa-icon> {{ 'common:dialogs.discard_changes' | t }}</button>
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal" (click)="cancel()">{{ 'common:actions.cancel' | t }}</button>
      </div>
</app-modal-dialog>
