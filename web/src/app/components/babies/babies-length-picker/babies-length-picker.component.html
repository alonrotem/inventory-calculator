<div class="picker-title">{{ this.title }}</div>
<div>
@for (current_length of lengths; track $index) {
        <div 
            (click)="setLength(current_length.length)" 
            [className]="((this.selected_lengths.includes(Number(current_length.length)))? 'length-selector-box selected-length' :'length-selector-box')">
            {{ 'common:units.cm_1' | t: { value: current_length.length } }}
            <div [hidden]="!show_counts" class="text-secondary length-count">{{ current_length.count | number: '1.0-0' }}</div>
        </div>
}
</div>
<div class="text-danger" *ngIf="isLengthInvalid()">{{ 'wings:length_picker.invalid' | t }}</div>
