<div class="picker-title">{{ this.title }}</div>
<div>
@for (current_length of lengths; track $index) {
    <div 
        (click)="setLength(current_length)" 
        [className]="((this.selected_lengths.includes(Number(current_length)))? 'length-selector-box selected-length' :'length-selector-box')">{{ current_length }} {{ this.units }}</div>
}
</div>
<div class="text-danger" *ngIf="isLengthInvalid()">Please select the length</div>
